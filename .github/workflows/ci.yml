name: Test and package Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:win
      - name: Test packaged Windows app
        shell: pwsh
        run: |
          $env:CNX_ELECTRON_PATH = (Resolve-Path 'release/win-unpacked/CNX Calculator.exe').Path
          npm run test:ui
      - name: ZIP and SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath 'release/CNX-Calculator-Windows-x64.zip'
          Get-ChildItem release -File | Where-Object Extension -In '.exe','.zip' | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS.txt
          (Get-Content package.json -Raw | ConvertFrom-Json).version | Set-Content release/VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: CNX-Calculator-Windows-x64
          include-hidden-files: true
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/VERSION
            .verification/ui-results.json
            .verification/calculator.png
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CNX-Calculator-Windows-x64
          path: artifacts
      - id: version
        run: echo "version=$(tr -d '\r\n' < artifacts/release/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CNX Calculator v${{ steps.version.outputs.version }}
          body: |
            Windows x64 离线科学计算器，十种模式，支持键盘及鼠标，MIT 开源。
            参照 fx-991CN X 独立实现的早期版本；完整兼容范围和差异见 README。
            下载便携 EXE 双击运行，或解压整个 ZIP 后运行 CNX Calculator.exe。
            SHA256SUMS.txt 提供文件校验值。
          files: |
            artifacts/release/*.exe
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
