<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:340px;height:177px;overflow:hidden}#host{width:340px;height:177px;background:white;font:12px Arial}.fixture-calc{height:100%;display:flex;flex-direction:column;gap:4px;padding:3px}.fixture-calc input{width:100%;font:14px Consolas}.fixture-calc output{font:14px Consolas;min-height:30px;overflow:auto}</style></head><body><section id="host"></section><script type="module">
import {ModelCalculator} from '/src/engine/model-calculator.js';
import {createCGSetupPanel} from '/src/ui/cg-setup-panel.js';
import {createCGProgramPanel} from '/src/ui/cg-program-panel.js';
import {getCGSetupPreferences,formatCGSetupValue,cgSetupFractionTex} from '/src/engine/cg-setup-state.js';
import {evaluateCGRationalExpression,simplifyCGRational} from '/src/engine/cg-rational-display.js';
import katex from 'katex';
import '/node_modules/katex/dist/katex.min.css';
const host=document.querySelector('#host');let panel;window.fixtureErrors=[];window.addEventListener('error',event=>window.fixtureErrors.push(event.message));
window.resetFixture=()=>{panel?.destroy();panel=null;window.calculator=new ModelCalculator('cg50');window.profile={mode:'calc',expr:'sin(30)+1/3',latex:'\\sin(30)+\\frac{1}{3}',history:[{expr:'2+3',answer:'5'}],decimal:true,format:'Norm',digits:10,cgWorkspace:{system:{brightness:.9}},matrices:{MatA:[[1,2]]}};window.fixtureExactAnswer=null;window.fixtureWrites=0;window.fixtureBack=0;showCalculator();};
function renderValue(value,exact){const profile=window.profile,calc=window.calculator,preferences=getCGSetupPreferences(calc,profile),out=host.querySelector('output');out.dataset.text=formatCGSetupValue(value,calc,profile,exact);if(preferences.inputOutput==='Line'||profile.decimal||profile.format!=='Norm'||preferences.engineering||preferences.complex==='polar'){out.textContent=out.dataset.text;out.dataset.tex='';}else {out.dataset.tex=cgSetupFractionTex(value,calc,profile,exact);out.innerHTML=katex.renderToString(out.dataset.tex,{throwOnError:false,trust:false});}}
function showCalculator(){host.innerHTML='<div class="fixture-calc"><strong>RUN-MATRIX</strong><input data-calc-entry><div><button data-calc-exe>EXE</button><button data-open-setup>SET UP</button><button data-calc-simp>Simp</button></div><output data-calc-output></output></div>';host.querySelector('input').value=window.profile.expr;host.querySelector('[data-calc-exe]').onclick=()=>{const profile=window.profile,calc=window.calculator,source=host.querySelector('input').value;profile.expr=source;const preferences=getCGSetupPreferences(calc,profile),value=calc.evaluate(source,{},preferences.complex!=='real'),exact=evaluateCGRationalExpression(source,{variables:{...calc.vars,Ans:window.fixtureExactAnswer||calc.vars.Ans}});window.fixtureExactAnswer=exact;renderValue(value,exact);profile.history.push({expr:source,answer:host.querySelector('output').dataset.text});};host.querySelector('[data-open-setup]').onclick=()=>window.openSetup();host.querySelector('[data-calc-simp]').onclick=()=>{const preferences=getCGSetupPreferences(window.calculator,window.profile),result=simplifyCGRational(window.fixtureExactAnswer,{...preferences,mode:preferences.format});window.fixtureExactAnswer=result.answer;renderValue(Number(result.answer.n)/Number(result.answer.d),result.answer);host.querySelector('output').dataset.factor=result.factor?.toString()||'';};}
function showProgram(){panel=createCGProgramPanel({host,calculator:window.calculator,data:window.profile.cgWorkspace.program||{programs:[{name:'FORMAT',source:'Print 200/7'}]},workspace:window.profile.cgWorkspace,initialFormat:{mode:window.profile.format,digits:window.profile.digits,norm:window.profile.cgWorkspace.system?.norm??1},onChange:value=>window.profile.cgWorkspace.program=value,onMemoryChange:memory=>{window.profile.format=memory.format.mode;window.profile.digits=memory.format.digits;window.profile.cgWorkspace.system.norm=memory.format.norm;}});window.fixturePanel=panel;}
window.openSetup=(mode=window.profile.mode)=>{panel?.destroy();window.profile.mode=mode;panel=createCGSetupPanel({host,calculator:window.calculator,profile:window.profile,mode,onChange:()=>window.fixtureWrites++,onBack:()=>{window.fixtureBack++;panel.destroy();panel=null;if(window.profile.mode==='program')showProgram();else showCalculator();}});window.fixturePanel=panel;};
window.addEventListener('keydown',event=>{if(panel?.handleKey(event)){event.preventDefault();return;}if(panel&&/^F[1-6]$/.test(event.key)){event.preventDefault();panel.handleAction('cg-f'+event.key.slice(1));}});
window.resetFixture();window.fixtureReady=true;
</script></body></html>
