<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CG list header expressions 177px</title><style>body{margin:10px;background:#dbe1e8}#screen{width:340px;height:177px;background:white;padding:4px;overflow:hidden;box-sizing:content-box}nav{display:flex;gap:4px;flex-wrap:wrap;width:348px;margin-top:8px}nav button{font:11px Arial}</style></head><body><main id="screen"></main><nav><button data-physical="up">↑</button><button data-physical="down">↓</button><button data-physical="left">←</button><button data-physical="right">→</button><button data-physical="execute">EXE</button><button data-physical="back">EXIT</button><button data-token="List">List</button><button data-physical="1">1</button><button data-physical="2">2</button><button data-physical="+">+</button></nav><script type="module">
import {ModelCalculator} from '/src/engine/model-calculator.js';
import {createCGStatisticsPanel} from '/src/ui/cg-statistics-panel.js';
import {sanitizeCGStatistics,cgStatisticsMemoryBytes} from '/src/engine/cg-statistics.js';
import {readOnlyCalculator} from '/src/engine/read-only-calculator.js';
window.formulaChanges=[];window.formulaBack=0;window.formulaMemoryBytes=cgStatisticsMemoryBytes;
window.makeFormulaStats=(data={},options={})=>{
  window.formulaPanel?.destroy();window.formulaData=sanitizeCGStatistics(data);window.formulaChanges=[];window.formulaRejectStorage=false;
  let calculator=new ModelCalculator('cg50',{angle:'Rad'});calculator.vars.Ans=73;calculator.statisticalMemory.p=.125;calculator.financialMemory.n=9;calculator.financialSettings.days=360;calculator.nativeAnswers={list:[99]};calculator.arrayMemory={lists:[[999]],names:['PARENT']};
  if(options.isolated)calculator=readOnlyCalculator(calculator);window.formulaCalculator=calculator;window.formulaCalcSaved=()=>JSON.parse(JSON.stringify(calculator.save()));
  window.formulaPanel=createCGStatisticsPanel({host:document.querySelector('#screen'),calculator,data,complex:options.complex===true,memoryLimitBytes:options.limitBytes,onChange:value=>{window.formulaChanges.push(structuredClone(value));window.formulaData=structuredClone(value);return !window.formulaRejectStorage;},onBack:()=>window.formulaBack++});window.formulaPanel.focus();
};
window.makeFormulaStats();
document.addEventListener('keydown',event=>{if(event.defaultPrevented)return;if(/^F[1-6]$/.test(event.key)){event.preventDefault();window.formulaPanel.handleAction('cg-f'+event.key.slice(1));}else if(window.formulaPanel.handleKey(event))event.preventDefault();});
document.querySelector('nav').addEventListener('click',event=>{if(event.target.dataset.physical)window.formulaPanel.handleAction(event.target.dataset.physical);else if(event.target.dataset.token)window.formulaPanel.insert(event.target.dataset.token);});
</script></body></html>
