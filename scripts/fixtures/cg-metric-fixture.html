<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Native Metric Conversion menu</title><style>body{margin:16px;background:#dfe4e9}#host{width:320px;height:177px;background:white;border:1px solid #777;padding:3px;box-sizing:border-box}#entry{box-sizing:border-box;width:100%;border:0;border-bottom:1px solid #aaa;font:15px Consolas,monospace}#answer{text-align:right;font:15px Consolas,monospace;padding:6px 2px;overflow-wrap:anywhere}#outside{margin-top:10px}</style></head><body><div id="host"><input id="entry" value="50" aria-label="Calculator input"><div id="answer"></div></div><button id="outside">Outside</button><script type="module">
import {createCGMetricMenu} from '/src/ui/cg-metric-menu.js';
import {convertCGMetric,parseCGMetricConversion} from '/src/engine/cg-metric-conversion.js';
let controller,inserts=[],arrows=0,backs=0,changes=0,failInsert=false;const host=document.getElementById('host'),entry=document.getElementById('entry');
function insert(text){entry.setRangeText(text,entry.selectionStart??entry.value.length,entry.selectionEnd??entry.value.length,'end');entry.focus();}
function mount(value={}){controller?.destroy();entry.value=value.expression??'50';entry.focus();entry.setSelectionRange(entry.value.length,entry.value.length);document.getElementById('answer').textContent='';inserts=[];arrows=0;backs=0;changes=0;failInsert=false;controller=createCGMetricMenu({host,showSoftkeys:value.showSoftkeys!==false,initialState:value.initialState||{},onInsertUnit:unit=>{if(failInsert)throw Error('Insertion test error');inserts.push({id:unit.id,command:unit.command,category:unit.category});insert(unit.command);},onInsertArrow:()=>{arrows++;insert('▶');},onBack:()=>backs++,onChange:()=>changes++});}
window.fixtureMetric={mount,action:value=>controller.handleAction(value),press:value=>controller.press(value),key:value=>controller.handleKey(value),labels:()=>controller.labels(),state:()=>controller.getState(),snapshot:()=>({inserts,arrows,backs,changes,expression:entry.value}),calculate(){const parsed=parseCGMetricConversion(entry.value);if(!parsed)throw Error('Fixture expects a conversion');const source=JSON.parse(parsed.expression.replace(/^\{(.*)\}$/,'[$1]'));const result=convertCGMetric(source,parsed.from,parsed.to);document.getElementById('answer').textContent=Array.isArray(result)?'{'+result.join(',')+'}':String(Number(result.toPrecision(10)));return result;},fail:value=>failInsert=value,destroy:()=>controller.destroy(),start:value=>controller.start(value)};
document.addEventListener('keydown',event=>{if(controller?.handleKey(event))event.preventDefault();});mount();window.fixtureReady=true;
</script></body></html>
