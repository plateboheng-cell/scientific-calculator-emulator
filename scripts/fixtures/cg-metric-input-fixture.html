<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:340px;height:177px;overflow:hidden;font:12px Arial}main{height:100%;padding:5px;display:flex;flex-direction:column;gap:4px}header{font-size:13px;font-weight:bold}#entry{width:100%;font-size:21px;min-height:48px}input#entry{font:19px Consolas;min-height:38px}nav{display:flex;gap:4px;flex-wrap:wrap}button{font-size:11px;min-height:22px}output{font:16px Consolas;text-align:right}</style></head><body><main><header>RUN-MATRIX · Metric input</header><section data-entry></section><nav><button data-mode="math">Math</button><button data-mode="line">Line</button><button data-unit="cm">[cm]</button><button data-arrow>▶</button><button data-unit="in">[in]</button><button data-exe>EXE</button><button data-unit="m">[m]</button><button data-prefix="List">List</button><button data-prefix="Mat">Mat</button><button data-prefix="Vct">Vct</button></nav><output></output></main><script type="module">
import {createMathInput,readInput,insertIntoMath} from '/src/math-input.js';
import {createCGLinearEditor} from '/src/input/cg-linear-editor.js';
import {metricUnitLatex,metricArrowLatex,metricUnitToken,metricArrowToken} from '/src/input/cg-metric-symbols.js';
import {expressionToLatex} from '/src/engine/notation.js';
import {cgNativePrefixLatex} from '/src/input/cg-native-symbols.js';
import {ModelCalculator} from '/src/engine/model-calculator.js';
import {evaluateCGRunMatrix} from '/src/engine/cg-run-matrix.js';
let mode='math',input,editor;const output=document.querySelector('output');window.errors=[];window.addEventListener('error',event=>window.errors.push(event.message));window.calc=new ModelCalculator('cg50');window.calc.arrayMemory={lists:[[1,2,3]],matrices:{MatA:[[1,2],[3,4]]},vectors:{VctA:[[5,6]]}};
window.setMode=value=>{editor?.destroy();editor=null;mode=value;input=mode==='math'?createMathInput({id:'entry'}):Object.assign(document.createElement('input'),{id:'entry'});document.querySelector('[data-entry]').replaceChildren(input);if(mode==='line')editor=createCGLinearEditor(input);input.focus();};
window.setSource=source=>{if(mode==='math')input.value=expressionToLatex(source);else editor.setSource(source);output.textContent='';input.focus();};
window.setLatex=value=>{input.value=value;input.focus();};
window.insertUnit=id=>mode==='math'?insertIntoMath(input,metricUnitLatex(id)):editor.insertToken(metricUnitToken(id));window.insertArrow=()=>mode==='math'?insertIntoMath(input,metricArrowLatex()):editor.insertToken(metricArrowToken());
window.insertPrefix=name=>mode==='math'?insertIntoMath(input,cgNativePrefixLatex(name)):editor.insertSource(name);
window.state=()=>({mode,source:mode==='math'?readInput(input):editor.source(),latex:mode==='math'?input.value:null,display:mode==='line'?input.value:input.getValue('ascii-math'),tokens:editor?.getTokens()??[],output:output.textContent});
window.run=()=>{try{const source=window.state().source,value=/\b(?:List\d+|Mat[A-Z]|Vct[A-Z])\[/.test(source)?evaluateCGRunMatrix(window.calc,source,window.calc.arrayMemory).value:window.calc.evaluate(source);output.textContent=JSON.stringify(value.toArray?.()??value);return value.toArray?.()??value;}catch(error){output.textContent=error.message;throw error;}};
document.querySelectorAll('button').forEach(button=>button.addEventListener('mousedown',event=>event.preventDefault()));document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>window.setMode(button.dataset.mode));document.querySelectorAll('[data-unit]').forEach(button=>button.onclick=()=>window.insertUnit(button.dataset.unit));document.querySelectorAll('[data-prefix]').forEach(button=>button.onclick=()=>window.insertPrefix(button.dataset.prefix));document.querySelector('[data-arrow]').onclick=window.insertArrow;document.querySelector('[data-exe]').onclick=window.run;document.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();window.run();}});window.setMode('math');window.fixtureReady=true;
</script></body></html>
