<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:340px;height:177px;overflow:hidden;font:12px Arial;background:#fff;color:#122142}main{padding:6px;display:flex;flex-direction:column;gap:6px;height:100%}strong{font-size:13px;border-bottom:1px solid #9ca9bb;padding-bottom:3px}input{width:100%;font:19px Consolas,monospace;border:1px solid #788ba0;padding:4px;min-height:36px}nav{display:flex;gap:3px;flex-wrap:wrap}button{font:11px Arial;min-height:24px;padding:3px 7px;background:#e7edf5;border:1px solid #9ca9bb}output{font:18px Consolas,monospace;overflow:auto;min-height:24px;text-align:right}
</style></head><body><main><strong>RUN-MATRIX · Line I/O</strong><input data-line-input aria-label="Line expression" autocomplete="off"><nav><button data-token="fin">FIN n</button><button data-token="stat">STAT n</button><button data-token="py">P/Y</button><button data-token="cmpd">Cmpd_I%</button><button data-token="xhat">x̂</button><button data-token="yhat">ŷ</button><button data-exe>EXE</button></nav><output data-output></output></main><script type="module">
import {ModelCalculator} from '/src/engine/model-calculator.js';
import {createCGLinearEditor} from '/src/input/cg-linear-editor.js';
const input=document.querySelector('[data-line-input]'),output=document.querySelector('[data-output]'),tokens={fin:{name:'n',parserName:'Finance_n'},stat:{name:'n',parserName:'CGStat_n'},py:{name:'P/Y',parserName:'Finance_PY'},cmpd:{name:'Cmpd_I%',parserName:'Cmpd_I',args:['n','PV','PMT','FV']},xhat:{name:'x̂',parserName:'CGStat_xhat',syntax:'postfix'},yhat:{name:'ŷ',parserName:'CGStat_yhat',syntax:'postfix'}};
window.fixtureErrors=[];window.changes=[];window.addEventListener('error',event=>window.fixtureErrors.push(event.message));
window.calculator=new ModelCalculator('cg50',{angle:'Deg'});window.calculator.financialMemory={n:12,rate:6,pv:1000,pmt:-100,fv:0,py:12,cy:12};window.calculator.statisticalMemory={n:7,p:.025,z:2};window.calculator.statisticalRegression={type:'linear',coefficients:[2,3],rows:[[0,2,1],[1,5,1],[2,8,1]]};window.calculator.assign('P',9);window.calculator.assign('y',3);
window.editor=createCGLinearEditor(input,{onChange:(canonical,display)=>{window.changes.push({canonical,display});output.textContent='';output.removeAttribute('data-value');}});
window.setSource=source=>{window.editor.setSource(source);output.textContent='';output.removeAttribute('data-value');input.focus();};
window.run=()=>{try{const value=window.calculator.evaluate(window.editor.source(),{},true);output.dataset.value=String(value);output.textContent=String(value);}catch(error){output.dataset.value='ERROR';output.textContent=error.message;}};
window.state=()=>({canonical:window.editor.source(),display:input.value,tokens:window.editor.getTokens(),changes:window.changes.slice(),value:output.dataset.value,selection:[input.selectionStart,input.selectionEnd]});
document.querySelectorAll('button').forEach(button=>button.addEventListener('mousedown',event=>event.preventDefault()));document.querySelectorAll('[data-token]').forEach(button=>button.onclick=()=>window.editor.insertToken(tokens[button.dataset.token]));document.querySelector('[data-exe]').onclick=window.run;input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();window.run();}});input.focus();window.fixtureReady=true;
</script></body></html>
