<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CG Chapter 9 Sheet</title><style>body{margin:15px;background:#dfe4e9}#host{width:320px;height:177px;padding:3px;background:white;box-sizing:content-box}</style></head><body><div id="host"></div><script type="module">
import {ModelCalculator} from '/src/engine/model-calculator.js';
import {NativeCGSpreadsheet} from '/src/engine/cg-spreadsheet-native.js';
import {createCGWorkspacePanel} from '/src/ui/cg-workspace-panel.js';
const host=document.getElementById('host'),calculator=new ModelCalculator('cg50');let panel,data={},matrices={},vectors={},graph={expressions:Array(20).fill(''),enabled:Array(20).fill(true)},back=0;
window.fixtureSheet={mount(value={},memory){panel?.destroy();data=structuredClone(value);if(memory){matrices=structuredClone(memory.matrices||{});vectors=structuredClone(memory.vectors||{});}panel=createCGWorkspacePanel({host,calculator,data,matrices,vectors,graph,mode:'spreadsheet',onChange:value=>{data=value;},onBack:()=>back++});},snapshot:()=>structuredClone(data),action:value=>panel.handleAction(value),insert:value=>panel.insert(value),memory:()=>({matrices:structuredClone(matrices),vectors:structuredClone(vectors),vars:structuredClone(calculator.save().vars)}),graph:()=>structuredClone(graph),cell:address=>new NativeCGSpreadsheet(calculator,data.spreadsheet).value(address),format:address=>new NativeCGSpreadsheet(calculator,data.spreadsheet).effectiveFormat(address),back:()=>back};
document.addEventListener('keydown',event=>{if(panel?.handleKey(event)){event.preventDefault();return;}if(/^F[1-6]$/.test(event.key)){event.preventDefault();const shifted={F1:'graph-trace',F2:'graph-zoom',F3:'graph-window',F4:'graph-sketch',F5:'graph-root',F6:'graph-toggle'};panel.handleAction(event.shiftKey?shifted[event.key]:'cg-f'+event.key.slice(1));}});
window.fixtureSheet.mount();window.fixtureReady=true;
</script></body></html>
