<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CG Chapter 16 UI</title><style>body{margin:15px;background:#dce1e6}#host{width:320px;height:177px;background:white;padding:3px;box-sizing:content-box}</style></head><body><div id="host"></div><script type="module">
import {ModelCalculator} from '/src/engine/model-calculator.js';
import {createCG3DPanel} from '/src/ui/cg-3d-panel.js';
const host=document.getElementById('host'),calculator=new ModelCalculator('cg50');let panel,data={},changes=0,back=0;
window.fixture3D={mount(value={}){panel?.destroy();data=structuredClone(value);panel=createCG3DPanel({host,calculator,data,onChange:value=>{data=value;changes++;},onBack:()=>back++});},snapshot:()=>structuredClone(data),action:value=>panel.handleAction(value),insert:value=>panel.insert(value),changes:()=>changes,back:()=>back,destroy:()=>panel.destroy()};
document.addEventListener('keydown',event=>{if(panel?.handleKey(event)){event.preventDefault();return;}if(/^F[1-6]$/.test(event.key)){event.preventDefault();const shifted={'1':'graph-trace','2':'graph-zoom','3':'graph-window','4':'graph-sketch','5':'graph-root','6':'graph-toggle'};panel.handleAction(event.shiftKey?shifted[event.key.slice(1)]:'cg-f'+event.key.slice(1));}});
window.fixture3D.mount();window.fixtureReady=true;
</script></body></html>
