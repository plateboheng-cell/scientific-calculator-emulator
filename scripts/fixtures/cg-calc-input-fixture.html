<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:340px;height:177px;overflow:hidden;font:12px Arial}main{height:100%;padding:5px;display:flex;flex-direction:column;gap:4px}header{font-size:13px;font-weight:bold}#entry{width:100%;font-size:19px;min-height:48px}input#entry{font:17px Consolas;min-height:38px}nav{display:flex;gap:3px;flex-wrap:wrap}button{font-size:10px;min-height:21px}output{font:11px Consolas;overflow:auto;overflow-wrap:anywhere;max-height:35px}</style></head><body><main><header>RUN-MATRIX · CALC input</header><section data-entry></section><nav><button data-mode="math">Math</button><button data-mode="line">Line</button><span data-functions></span><button data-infix="Int÷">Int÷</button><button data-infix="Rmdr">Rmdr</button></nav><output></output></main><script type="module">
import {createMathInput,readInput,insertIntoMath} from '/src/math-input.js';
import {createCGLinearEditor} from '/src/input/cg-linear-editor.js';
import {CG_CALC_FUNCTIONS,cgCalcFunctionLatex,cgCalcInfixLatex,cgCalcTokenMeta} from '/src/input/cg-calc-symbols.js';
import {expressionToLatex} from '/src/engine/notation.js';
import {rewriteCGCalcExpression} from '/src/engine/cg-calc-expression.js';
import {Calculator,math} from '/src/engine/calculator.js';
let mode='math',input,editor;const output=document.querySelector('output');window.errors=[];window.addEventListener('error',event=>window.errors.push(event.message));
window.setMode=value=>{editor?.destroy();editor=null;mode=value;input=mode==='math'?createMathInput({id:'entry'}):Object.assign(document.createElement('input'),{id:'entry'});document.querySelector('[data-entry]').replaceChildren(input);if(mode==='line')editor=createCGLinearEditor(input);input.focus();};
window.setSource=source=>{if(mode==='math')input.value=expressionToLatex(source);else editor.setSource(source);output.textContent='';input.focus();};
window.insertFunction=name=>mode==='math'?insertIntoMath(input,cgCalcFunctionLatex(name)+'\\left(#?\\right)'):editor.insertToken(cgCalcTokenMeta(name));window.insertInfix=name=>mode==='math'?insertIntoMath(input,cgCalcInfixLatex(name)):editor.insertToken(cgCalcTokenMeta(name));
window.insertBody=value=>mode==='math'?insertIntoMath(input,value):editor.insertText(value);
window.state=()=>({mode,source:mode==='math'?readInput(input,{family:'cg'}):editor.source(),latex:mode==='math'?input.value:null,display:mode==='line'?input.value:input.getValue('ascii-math'),tokens:editor?.getTokens()??[]});
window.prepare=()=>{const source=window.state().source,result=rewriteCGCalcExpression(source);output.textContent=result;return result;};
window.guardNumericalEvaluation=()=>{const calculatorEvaluate=Calculator.prototype.evaluate,mathEvaluate=math.evaluate;let calls=0;const forbidden=()=>{calls++;throw Error('Unexpected numerical evaluation during input serialization');};Calculator.prototype.evaluate=forbidden;math.evaluate=forbidden;try{const value=window.state();window.setSource(value.source);window.prepare();return calls;}finally{Calculator.prototype.evaluate=calculatorEvaluate;math.evaluate=mathEvaluate;}};
document.querySelector('[data-functions]').innerHTML=CG_CALC_FUNCTIONS.map(spec=>'<button data-function="'+spec.parserName+'">'+spec.name+'</button>').join('');document.querySelectorAll('button').forEach(button=>button.addEventListener('mousedown',event=>event.preventDefault()));document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>window.setMode(button.dataset.mode));document.querySelectorAll('[data-function]').forEach(button=>button.onclick=()=>window.insertFunction(button.dataset.function));document.querySelectorAll('[data-infix]').forEach(button=>button.onclick=()=>window.insertInfix(button.dataset.infix));window.setMode('math');window.fixtureReady=true;
</script></body></html>
