<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Native CG Graph</title></head><body><main class="model-cg graph-view"><section class="lcd" id="host"></section></main><script type="module">
import '/src/style.css';
import {ModelCalculator} from '/src/engine/model-calculator.js';
import {sanitizeGraph,sanitizeProfile} from '/src/state/store.js';
import {createGraphPanel} from '/src/ui/graph-panel.js';
import {createCGFunctionMemoryPanel} from '/src/ui/cg-function-memory-panel.js';
import {expressionToLatex} from '/src/engine/notation.js';
import {encodeProgramPicture} from '/src/engine/cg-program-pictures.js';
const style=document.createElement('style');style.textContent='body{display:block;background:#ddd}#host{position:absolute;left:18px;top:18px;width:320px;height:177px;padding:3px 4px;box-sizing:content-box}';document.head.append(style);
let panel,calculator,graph,workspace,profile,changes=0,inserts=[],back=0;
function mount(value={}){panel?.destroy();graph=sanitizeGraph(value.graph||{expressions:['x^2']},20);workspace=structuredClone(value.workspace||{});profile={mode:'graph',format:value.format||'Norm',digits:value.digits??10,cgWorkspace:workspace};calculator=new ModelCalculator('cg50',value.calculator||{});calculator.assign('Ans',17);calculator.assign('x',123);panel=createGraphPanel({host:document.getElementById('host'),calculator,settings:graph,workspace,profile,onCommit:()=>changes++});}
window.fixtureGraph={mount,action(name,...args){if(/^f[1-6]$/.test(name))return panel.softKey(+name.slice(1));return panel[name]?.(...args);},key:event=>panel.handleKey(event),insert:text=>panel.insert(text),expression(index,text,second=false){const field=document.getElementById(second?'graph-y2-'+index:'graph-y'+index);field.value=expressionToLatex(text);field.dispatchEvent(new Event('input',{bubbles:true}));field.focus();},snapshot:()=>JSON.parse(JSON.stringify({graph,workspace,profile,calculator:calculator.save(),changes})),reload(){const restored=sanitizeProfile({graph,cgWorkspace:workspace,calculator:calculator.save(),format:profile.format,digits:profile.digits},'cg50');mount({graph:restored.graph,workspace:restored.cgWorkspace,calculator:restored.calculator,format:restored.format,digits:restored.digits});},picture(slot,color=[220,30,10,255]){workspace.programImageBanks??={pict:{},capture:{}};workspace.programImageBanks.pict[slot]=encodeProgramPicture({width:4,height:4,data:new Uint8ClampedArray(Array.from({length:16},()=>color).flat())});},functionMemory(value){calculator.functionMemory=value.concat(Array(20).fill('')).slice(0,20);},functions(expression){panel?.destroy();panel=createCGFunctionMemoryPanel({host:document.getElementById('host'),calculator,expression,onInsert:text=>inserts.push(text),onChange:()=>changes++,onBack:()=>back++});},functionAction:value=>panel.handleAction(value),inserts:()=>inserts,backCount:()=>back};
document.addEventListener('keydown',event=>{if(panel?.handleKey(event)){event.preventDefault();return;}if(/^F[1-6]$/.test(event.key)){event.preventDefault();if(panel.softKey)panel.softKey(+event.key.slice(1));else panel.handleAction('cg-f'+event.key.slice(1));}});
mount();window.fixtureReady=true;
</script></body></html>
